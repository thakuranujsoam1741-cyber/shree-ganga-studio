<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shree Ganga Studio</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    nav.navbar { margin-bottom: 25px; }
    .nav-link { position: relative; transition: color 0.3s ease; }
    .nav-link:hover { color: #f8a500; }
    .nav-link::after { content: ""; position: absolute; width: 100%; height: 2px; background-color: #f8a500; left: 0; bottom: -5px; transform: scaleX(0); transform-origin: bottom right; transition: transform 0.3s ease; }
    .nav-link:hover::after { transform: scaleX(1); transform-origin: bottom left; }
    body { scroll-behavior: smooth; background-color: #f8f9fa; }
    img { cursor: pointer; transition: transform 0.3s ease; }
    img:hover { transform: translateY(-8px); }
    .modal-dialog { max-width: 75%; margin: 0 auto; }
    .modal-content { width: 100%; height: 75vh; }
    .modal-body { padding: 0; }
    .modal-body img { width: 100%; height: 100%; object-fit: contain; }
    .fade-in-img { opacity: 0; transform: translateY(20px); animation: fadeUp 1s ease forwards; animation-delay: var(--delay, 0s); }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    .hover-underline { position: relative; display: inline-block; cursor: pointer; text-decoration: none; }
    .hover-underline::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1px; background: white; transform-origin: center; transition: 0.2s; }
    .hover-underline:hover::after { animation: wiggle 0.35s ease; }
    @keyframes wiggle { 0% { transform: translateX(0); } 25% { transform: translateX(-2px); } 50% { transform: translateX(2px); } 75% { transform: translateX(-1px); } 100% { transform: translateX(0); } }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg bg-white py-3 shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="shri-ganga-studio.html">
        <img src="main-image/logo -2.png" width="55" class="me-2" alt="Logo">
        <span class="fw-semibold text-dark">shreegangastudio</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link px-3" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="portfolio.html">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="films.html">Films</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="about.html">About</a></li>
        </ul>
        <div class="d-flex align-items-center ms-lg-3 gap-3">
          <a href="#"><i class="fab fa-instagram fa-lg text-dark"></i></a>
          <a href="#"><i class="fab fa-youtube fa-lg text-dark"></i></a>
          <a href="#"><i class="fab fa-facebook fa-lg text-dark"></i></a>
        </div>
        <a href="book-us.html" class="btn btn-outline-dark ms-lg-4 mt-3 mt-lg-0">Book Us</a>
      </div>
    </div>
  </nav>

  <div class="container mt-5 image-container">
    <div class="row">
      <!-- Image 1-3 (Updated Paths & Extensions based on image_5fd318.png) -->
      <div class="col-md-4 mb-4">
        <img src="_SSP8048.jpg" class="img-fluid rounded" alt="Image 1" data-bs-toggle="modal" data-bs-target="#imageModal" onclick="openModal(this)">
      </div>
      <div class="col-md-4 mb-4">
        <img src="_SON0524.jpeg" class="img-fluid rounded" alt="Image 2" data-bs-toggle="modal" data-bs-target="#imageModal" onclick="openModal(this)">
      </div>
      <div class="col-md-4 mb-4">
        <img src="_DUR8313-Edit.jpeg" class="img-fluid rounded" alt="Image 3" data-bs-toggle="modal" data-bs-target="#imageModal" onclick="openModal(this)">
      </div>
    </div>

    <div class="row">
      <!-- Image 8-9 (Updated) -->
      <div class="col-md-4 mb-4">
        <img src="_SSP0401.jpeg" class="img-fluid rounded" alt="Image 8" data-bs-toggle="modal" data-bs-target="#imageModal" onclick="openModal(this)">
      </div>
      <div class="col-md-4 mb-4">
        <img src="_SSP0343.jpeg" class="img-fluid rounded" alt="Image 9" data-bs-toggle="modal" data-bs-target="#imageModal" onclick="openModal(this)">
      </div>
      <div class="col-md-4 mb-4">
        <img src="_SSP0459.jpeg" class="img-fluid rounded" alt="Image 38" data-bs-toggle="modal" data-bs-target="#imageModal" onclick="openModal(this)">
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalImage" src="" class="img-fluid" alt="Large View">
        </div>
      </div>
    </div>
  </div>

  <footer class="text-white py-4" style="background:#56391d;">
    <div class="container text-center">
      <p class="fw-semibold mb-1">info@shreegangastudio.com</p>
      <p class="mb-0">● Real people, Real stories, Real moments ●</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

  <script>
    function openModal(img) {
      var modalImg = document.getElementById("modalImage");
      modalImg.src = img.src;
    }
    document.addEventListener("DOMContentLoaded", function () {
      const imgs = document.querySelectorAll(".image-container img");
      imgs.forEach((img, index) => {
        img.style.setProperty("--delay", (0.06 * (index + 1)) + "s");
        img.classList.add("fade-in-img");
      });
    });
  </script>

</body>
</html>
